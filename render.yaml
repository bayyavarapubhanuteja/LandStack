databases:
  - name: landstack-db
    plan: free
    databaseName: landstack
    user: landstack

services:
  - type: web
    name: landstack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # pydantic-core has no wheels for Python 3.14 (Render's default) and cannot build from source here.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: landstack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: landstack-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: landstack-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: landstack-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
