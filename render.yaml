# Single service: the FastAPI container serves both the REST API and the built
# React site, so no cross-service URLs or CORS configuration are required.
services:
  - type: web
    name: landstack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
